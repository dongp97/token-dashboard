<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Token Dashboard</h1>
            <p class="subtitle">DSH Token 用量监控</p>
        </header>

        <div class="summary-cards" id="summary-cards">
            <div class="card">
                <div class="card-label">Sessions</div>
                <div class="card-value" id="card-sessions">-</div>
            </div>
            <div class="card">
                <div class="card-label">Total Tokens</div>
                <div class="card-value" id="card-tokens">-</div>
            </div>
            <div class="card">
                <div class="card-label">Input Tokens</div>
                <div class="card-value" id="card-input">-</div>
            </div>
            <div class="card">
                <div class="card-label">Output Tokens</div>
                <div class="card-value" id="card-output">-</div>
            </div>
            <div class="card highlight">
                <div class="card-label">Total Cost</div>
                <div class="card-value" id="card-cost">-</div>
            </div>
        </div>

        <div class="grid">
            <div class="panel">
                <h2>By Model</h2>
                <div id="model-chart" class="chart"></div>
            </div>
            <div class="panel">
                <h2>Daily Usage</h2>
                <div id="daily-chart" class="chart"></div>
            </div>
        </div>

        <div class="panel">
            <h2>Top Sessions</h2>
            <table id="sessions-table">
                <thead>
                    <tr>
                        <th>Session ID</th>
                        <th>Calls</th>
                        <th>Tokens</th>
                        <th>Cost</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <footer>
            <span id="status">Loading...</span>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
